name: Build and Push Images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: CUDA version for GPU targets
        required: false
        default: "13.2.0"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dingp/communication-libraries-image
  CUDA_VERSION: ${{ github.event.inputs.cuda_version || '13.2.0' }}
  OSU_VERSION: "7.5.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - libfabric-cpu
          - libfabric-gpu
          - mpich-cpu
          - mpich-gpu
          - openmpi-cpu
          - openmpi-gpu
          - openmpi-ofi-ucx-cpu
          - openmpi-ofi-ucx-gpu
          - nccl-gpu
          - nvshmem-gpu

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify generated Containerfiles
        run: scripts/generate-target-containerfiles.py --check

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=ghcr.io/docker/buildkit:buildx-stable-1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: container/targets/${{ matrix.target }}.Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.target }}
          build-args: |
            CUDA_VERSION=${{ env.CUDA_VERSION }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  benchmark-build:
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        target:
          - bench-mpich-cpu
          - bench-mpich-gpu
          - bench-openmpi-cpu
          - bench-openmpi-gpu
          - bench-openmpi-ofi-ucx-cpu
          - bench-openmpi-ofi-ucx-gpu
          - bench-nccl-gpu
          - bench-nccl-mpich-gpu
          - bench-nvshmem-gpu

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=ghcr.io/docker/buildkit:buildx-stable-1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build benchmark image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: benchmarks/container/Containerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.target }}
          build-args: |
            BASE_IMAGE_REPO=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            OSU_VERSION=${{ env.OSU_VERSION }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
