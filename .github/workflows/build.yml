name: Build and Push Images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: CUDA version for GPU targets
        required: false
        default: "13.2.0"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dingp/communication-libraries-image
  CUDA_VERSION: ${{ github.event.inputs.cuda_version || '13.2.0' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - libfabric-cpu
          - libfabric-gpu
          - mpich-cpu
          - mpich-gpu
          - openmpi-cpu
          - openmpi-gpu
          - openmpi-ofi-ucx-cpu
          - openmpi-ofi-ucx-gpu
          - nccl-gpu
          - nvshmem-gpu

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Containerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.target }}
          build-args: |
            CUDA_VERSION=${{ env.CUDA_VERSION }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
